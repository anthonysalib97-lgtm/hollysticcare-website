<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hollystic Care | Disability Services</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      background: #ffffff;
      color: #6888b0;

      font-family: Georgia, "Times New Roman", serif;
    }

    .container {
      width: 100%;
      max-width: 700px;
      padding: 40px 24px;
      text-align: center;
    }

    .logo {
      display: block;
      width: min(100%, 520px);
      height: auto;
      margin: 0 auto 25px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 400;
      color: #6888b0;
    }

    p {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 17px;
      letter-spacing: 0.08em;
      color: #6888b0;
    }
  </style>
</head>

<body>
  <main class="container">

    <img
      class="logo"
      src="logo.png"
      alt="Hollystic Care Disability Services"
    >

    <h1>Coming Soon</h1>

    <p>Our new website is currently being developed.</p>

  </main>
</body>
</html>
